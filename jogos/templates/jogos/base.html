{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <title>{% block titulo %}{% endblock %} | SGJogos</title>
</head>
<body>
    <header class="cabecalho">
        <div class="conteudo">
            <a class="marca" href="{% url 'jogos:index' %}">
                <strong>SGJogos</strong>
                <span>Jogos Interclasses 2026 · IFRN Campus Pau dos Ferros</span>
            </a>
            <nav class="menu">
                <ul>
                    <li><a href="{% url 'jogos:index' %}">Equipes</a></li>
                    <li><a href="{% url 'admin:index' %}">Administração</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="conteudo">
        {% block conteudo %}{% endblock %}
    </main>

    <footer class="rodape">
        <div class="conteudo">
            <p>SGJogos · Desenvolvimento de Sistemas Web</p>
            <p>IFRN Campus Pau dos Ferros · 2026</p>
        </div>
    </footer>
</body>
</html>
